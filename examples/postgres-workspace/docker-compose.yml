services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "55433:5432"
    environment:
      POSTGRES_DB: blindfold
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blindfold"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
