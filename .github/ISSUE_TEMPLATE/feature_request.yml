name: Feature request
description: Suggest an improvement for Blindfold Auth
labels:
  - enhancement
body:
  - type: input
    id: summary
    attributes:
      label: Summary
      placeholder: Short description of the requested feature
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or need
      placeholder: What problem does this solve for you?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      placeholder: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      placeholder: What are you doing today instead?
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      placeholder: Links, screenshots, prior art, or adoption context
